[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 24 LTS (see "engines" in package.json and .nvmrc). Pinned here so the
  # build image does not fall back to an older default and fail the install.
  NODE_VERSION = "24"

# Static export: hashed assets can be cached forever, HTML must not be.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
